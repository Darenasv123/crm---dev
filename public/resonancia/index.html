<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0a0a12" />
    <title>RESONANCIA — Puzzle de Ecos</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0a12;
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }

      #app {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        position: relative;
      }

      #game {
        display: block;
        border-radius: 4px;
        cursor: crosshair;
      }

      #touch-pad {
        display: none;
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        padding: 12px 16px 24px;
        background: linear-gradient(transparent, rgba(10, 10, 18, 0.95));
        gap: 8px;
        flex-direction: column;
        align-items: center;
      }

      @media (pointer: coarse), (max-width: 768px) {
        #touch-pad {
          display: flex;
        }
      }

      .d-pad {
        display: grid;
        grid-template-columns: 56px 56px 56px;
        grid-template-rows: 56px 56px 56px;
        gap: 6px;
      }

      .d-pad button {
        width: 56px;
        height: 56px;
        border: 2px solid #2d2d5a;
        border-radius: 12px;
        background: rgba(26, 26, 46, 0.8);
        color: #00f5ff;
        font-size: 22px;
        cursor: pointer;
        transition:
          background 0.1s,
          transform 0.1s;
        -webkit-tap-highlight-color: transparent;
      }

      .d-pad button:active {
        background: rgba(0, 245, 255, 0.2);
        transform: scale(0.92);
      }

      .d-pad .empty {
        visibility: hidden;
      }

      .action-row {
        display: flex;
        gap: 12px;
        margin-top: 4px;
      }

      .action-row button {
        padding: 10px 20px;
        border: 2px solid #2d2d5a;
        border-radius: 10px;
        background: rgba(26, 26, 46, 0.8);
        color: #8888aa;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }

      .action-row button:active {
        background: rgba(255, 45, 149, 0.15);
        color: #ff2d95;
      }

      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0a12;
        color: #00f5ff;
        font-size: 14px;
        letter-spacing: 2px;
        transition: opacity 0.4s;
        z-index: 10;
      }

      #loading.hidden {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="loading">CARGANDO RESONANCIA...</div>

    <div id="app">
      <canvas id="game"></canvas>

      <div id="touch-pad">
        <div class="d-pad">
          <span class="empty"></span>
          <button data-dir="up" aria-label="Arriba">▲</button>
          <span class="empty"></span>
          <button data-dir="left" aria-label="Izquierda">◀</button>
          <button data-dir="wait" aria-label="Esperar">◎</button>
          <button data-dir="right" aria-label="Derecha">▶</button>
          <span class="empty"></span>
          <button data-dir="down" aria-label="Abajo">▼</button>
          <span class="empty"></span>
        </div>
        <div class="action-row">
          <button id="btn-restart">↺ Reiniciar</button>
          <button id="btn-wait">◎ Esperar turno</button>
        </div>
      </div>
    </div>

    <script type="module">
      import "./game.js";
      document.getElementById("loading").classList.add("hidden");
    </script>
  </body>
</html>
